# DGX Spark (GB10) loopback: 20 cores, no SMT, 1 NUMA, isolated=4-19
# Mapping rule: logical N -> cpu(N+4)
# Fast X925 (3900MHz): cpu5-9, cpu15-19 -> logical 1-5, 11-15
# Slow A725 (2808MHz): cpu4, cpu10-14  -> logical 0, 6-10

## L1 Core Allocation (cuphycontroller)
all_low_priority_threads: 0        # cpu4
dpdk_thread: 1                     # cpu5
fh_stats_dump_thread: -1           # Note: set to -1 to disable
h2d_copy_thread: 2                 # cpu6
ul_worker_threads: [3,4]           # cpu7,8
dl_worker_threads: [5,11,12]       # cpu9,15,16 
l2a_timer_thread: 6                # cpu10
l2a_message_processing_thread: 7   # cpu11
dl_debug_thread: -1                # Note: set to -1 to disable
l2a_pcap_capture_thread: 0         # cpu4

## Test Bench Only (testmac)
